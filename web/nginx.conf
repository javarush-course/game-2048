# /etc/nginx/nginx.conf образа jrgames/2048-web — файл nginx:1.29-alpine, отличия помечены «2048:»

user  nginx;
worker_processes  auto;

# 2048: warn вместо notice — служебные строки nginx о воркерах при запуске и остановке не засоряют журнал контейнера
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 2048: стандартный формат combined — без хвоста "$http_x_forwarded_for", который в журнале всегда "-"
    access_log  /var/log/nginx/access.log  combined;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
