# /etc/nginx/conf.d/default.conf образа jrgames/2048-web: страница игры на порту 80
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # страница всегда приходит целиком, с кодом 200: при обновлении вкладки нет ответа 304 «не изменилась»
    etag  off;
    if_modified_since  off;

    # в журнал пишутся только запросы страницы, а стили и скрипт игры — нет
    location ~* \.(css|js)$ {
        access_log  off;
    }
}
